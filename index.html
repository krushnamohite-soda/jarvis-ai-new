<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS AI</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #020817;
      color: #00d9ff;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .core {
      border: 3px solid #00d9ff;
      border-radius: 50%;
      width: 170px;
      height: 170px;
      margin: 30px auto;
      box-shadow: 0 0 30px #00d9ff;
      display: grid;
      place-items: center;
      font-size: 25px;
    }
    button {
      background: transparent;
      color: #00d9ff;
      border: 2px solid #00d9ff;
      padding: 15px 25px;
      border-radius: 30px;
      font-size: 17px;
    }
  </style>
</head>
<body>
  <main>
    <h1>J.A.R.V.I.S</h1>
    <div class="core">AI</div>
    <h3>SYSTEM ONLINE</h3>
    <p>नमस्कार बॉस! जार्विस तयार आहे.</p>
  </main>
</body>
</html>
